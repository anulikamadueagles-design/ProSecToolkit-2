name: ProSecToolkit Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ProSecToolkit APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Find ProSecToolkit package
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name 'ProSecToolkit-v1.2.1-Vector-Elements-Tech.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ProSecToolkit v1.2.1 ZIP was not found."
            exit 1
          fi

          echo "Found: $ZIP"

          mkdir -p package
          unzip -q "$ZIP" -d package

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find package -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            find package -maxdepth 6 -type f
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS")

          echo "Android project: $ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProSecToolkit-v1.2.1-APK
          path: ${{ env.APK }}
          if-no-files-found: error
